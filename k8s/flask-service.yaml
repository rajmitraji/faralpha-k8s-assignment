apiVersion: v1
kind: Service
metadata:
  name: flask-service
spec:
  # NodePort exposes the service on a static port on each node
  # combined with minikube, this lets us access flask from our host machine
  type: NodePort
  selector:
    app: flask-app
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30007

